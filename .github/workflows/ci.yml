name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.13"
            timeout: 30
          - os: windows-latest
            python: "3.12.10"
            timeout: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check peer dependencies
        run: pnpm peers check

      - name: Initialize Windows PowerShell runtime
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 2
        run: |
          # Prepare the native runtime before the gate. Actual ACL operations
          # retain their own 15-second deadline and all permission checks.
          $executable = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $info = [Diagnostics.ProcessStartInfo]::new($executable)
          $info.UseShellExecute = $false
          $info.CreateNoWindow = $true
          $info.WindowStyle = [Diagnostics.ProcessWindowStyle]::Hidden
          foreach ($argument in @('-NoLogo', '-NoProfile', '-NonInteractive', '-Command', '[Console]::WriteLine("Windows PowerShell runtime ready")')) {
            $info.ArgumentList.Add($argument)
          }
          $process = [Diagnostics.Process]::Start($info)
          try {
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              if (-not $process.WaitForExit(10000)) { throw 'Windows PowerShell startup process did not stop.' }
              throw 'Windows PowerShell startup exceeded 60 seconds.'
            }
            if ($process.ExitCode -ne 0) { throw 'Windows PowerShell startup failed.' }
            Write-Output 'Windows PowerShell runtime initialized.'
          } finally {
            $process.Dispose()
          }

      - name: Verify Android signing tool guards
        if: runner.os == 'Windows'
        shell: powershell
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('Signing.Common.psm1', 'Initialize-InvestmentAndroidSigning.ps1', 'Build-InvestmentAndroidRelease.ps1', 'Recover-InvestmentAndroidSigning.ps1', 'Signing.Common.Tests.ps1', 'Signing.Runtime.Tests.ps1')) {
            $tokens = $null
            $errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path 'scripts/android' $name), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "Android signing script failed parsing: $name" }
          }
          & ./scripts/android/Signing.Common.Tests.ps1
          & ./scripts/android/Signing.Runtime.Tests.ps1 -NodePath (Get-Command node).Source -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'investment-signing-runtime')

      - name: Run the release gate
        run: pnpm verify

      - name: Verify deployment tooling
        run: pnpm test:delivery

      - name: Capture public source provenance for deployment
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm exec tsx scripts/appwrite/github-checks.ts capture --output dist/source-proof.json

      - name: Retain the source proof for this CI attempt
        if: runner.os == 'Linux' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-proof-${{ github.run_attempt }}
          path: dist/source-proof.json
          if-no-files-found: error
          retention-days: 30
