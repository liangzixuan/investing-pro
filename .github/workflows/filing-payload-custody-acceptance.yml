permissions:
  contents: read

concurrency:
  group: filing-payload-custody-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Synthetic filing payload custody (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify exact Cycle 3k-a1 non-evidence routing closure
        id: cycle3ka1_route
        shell: bash
        run: |
          exact=false
          cycle2z_baseline="62c01dafe305ddd43c75688e0225163b3abdf6df"
          prior_closure="fa63a5de52c569857abcdc7f2b8995db800ced50"
          feature="5dd44acdbe3159d58d9f8983093d3afbb2d33ae5"
          expected=(
            "M" ".github/workflows/filing-parser-acceptance.yml"
            "M" ".github/workflows/filing-parser-cross-engine-execution-acceptance.yml"
            "M" ".github/workflows/filing-payload-custody-acceptance.yml"
            "M" "README.md"
            "M" "docs/BUILD_ROADMAP.md"
            "A" "docs/CURRENT_WORK.md"
            "M" "docs/PERSONAL_PRODUCT_BREADTH_ROADMAP.md"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.test.ts"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.test.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.ts"
          )
          matches_exactly() {
            if [[ "${#actual[@]}" != "${#expected[@]}" ]]; then
              return 1
            fi
            for index in "${!expected[@]}"; do
              if [[ "${actual[$index]}" != "${expected[$index]}" ]]; then
                return 1
              fi
            done
          }
          if git cat-file -e "$cycle2z_baseline^{commit}" && \
             git cat-file -e "$prior_closure^{commit}" && \
             git cat-file -e "$feature^{commit}"; then
            read -r -a head_topology <<< "$(git rev-list --parents -n 1 HEAD)"
            read -r -a feature_topology <<< "$(git rev-list --parents -n 1 "$feature")"
            mapfile -d '' -t actual < <(
              git diff --name-status --no-renames -z "$feature" HEAD --
            )
            if [[ "$(git merge-base "$cycle2z_baseline" HEAD)" == "$cycle2z_baseline" ]] && \
               [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline".."$feature")" == "65" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline".."$feature")" == "65" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline"..HEAD)" == "66" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline"..HEAD)" == "66" ]] && \
               [[ "${#feature_topology[@]}" == "2" ]] && \
               [[ "${feature_topology[0]}" == "$feature" ]] && \
               [[ "${feature_topology[1]}" == "$prior_closure" ]] && \
               [[ "${#head_topology[@]}" == "2" ]] && \
               [[ "${head_topology[0]}" == "$GITHUB_SHA" ]] && \
               [[ "${head_topology[1]}" == "$feature" ]] && \
               matches_exactly; then
              exact=true
            fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Classify exact partial Cycle 3k-a2 non-evidence routing closure
        id: cycle3ka2_route
        shell: bash
        run: |
          exact=false
          cycle2z_baseline="62c01dafe305ddd43c75688e0225163b3abdf6df"
          prior_closure="2f5bab2833acc6367fa4c1e5b20f3e15d6d3ec6e"
          feature="ad168082454aa243431138a3e3a300d048bde2d7"
          expected=(
            "M" ".github/workflows/filing-parser-acceptance.yml"
            "M" ".github/workflows/filing-parser-cross-engine-execution-acceptance.yml"
            "M" ".github/workflows/filing-payload-custody-acceptance.yml"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.test.ts"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.test.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.ts"
          )
          expected_feature=(
            "M" "README.md"
            "M" "apps/api/package.json"
            "A" "apps/api/src/personal-sec-financial-provider.test.ts"
            "A" "apps/api/src/personal-sec-financial-provider.ts"
            "M" "apps/api/src/workspace-app.ts"
            "M" "apps/api/src/workspace-composition-root.test.ts"
            "M" "apps/api/src/workspace-composition-root.ts"
            "A" "apps/api/src/workspace-financial-screen-routes.test.ts"
            "A" "apps/api/src/workspace-financial-screen-routes.ts"
            "M" "apps/api/src/workspace-static-graph.test.ts"
            "M" "apps/web/app/globals.css"
            "A" "apps/web/src/features/research/PersonalFinancialScreener.test.tsx"
            "A" "apps/web/src/features/research/PersonalFinancialScreener.tsx"
            "M" "apps/web/src/features/research/SecurityDiscoveryWorkspace.test.tsx"
            "M" "apps/web/src/features/research/SecurityDiscoveryWorkspace.tsx"
            "A" "apps/web/src/lib/personal-financial-screen-api.test.ts"
            "A" "apps/web/src/lib/personal-financial-screen-api.ts"
            "M" "apps/web/src/lib/personal-workspace-api.ts"
            "M" "docs/CURRENT_WORK.md"
            "M" "docs/PERSONAL_PRODUCT_BREADTH_ROADMAP.md"
            "A" "docs/SEC_ANNUAL_FINANCIAL_SCREENING.md"
            "M" "packages/contracts/src/index.ts"
            "A" "packages/contracts/src/personal-financial-screener.ts"
            "M" "packages/personal-financial-analytics/package.json"
            "M" "packages/personal-financial-analytics/src/index.ts"
            "A" "packages/personal-financial-analytics/src/personal-financial-screener.test.ts"
            "A" "packages/personal-financial-analytics/src/personal-financial-screener.ts"
            "M" "pnpm-lock.yaml"
            "M" "scripts/verify-boundaries.ts"
          )
          matches_exactly() {
            local -n expected_values="$1"
            local -n actual_values="$2"
            if [[ "${#actual_values[@]}" != "${#expected_values[@]}" ]]; then return 1; fi
            for index in "${!expected_values[@]}"; do
              if [[ "${actual_values[$index]}" != "${expected_values[$index]}" ]]; then return 1; fi
            done
          }
          if git cat-file -e "$cycle2z_baseline^{commit}" && \
             git cat-file -e "$prior_closure^{commit}" && \
             git cat-file -e "$feature^{commit}"; then
            read -r -a head_topology <<< "$(git rev-list --parents -n 1 HEAD)"
            read -r -a feature_topology <<< "$(git rev-list --parents -n 1 "$feature")"
            mapfile -d '' -t actual < <(
              git diff --name-status --no-renames -z "$feature" HEAD --
            )
            mapfile -d '' -t feature_actual < <(
              git diff --name-status --no-renames -z "$prior_closure" "$feature" --
            )
            if [[ "$(git merge-base "$cycle2z_baseline" HEAD)" == "$cycle2z_baseline" ]] && \
               [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline".."$feature")" == "67" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline".."$feature")" == "67" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline"..HEAD)" == "68" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline"..HEAD)" == "68" ]] && \
               [[ "${#feature_topology[@]}" == "2" ]] && \
               [[ "${feature_topology[0]}" == "$feature" ]] && \
               [[ "${feature_topology[1]}" == "$prior_closure" ]] && \
               [[ "${#head_topology[@]}" == "2" ]] && \
               [[ "${head_topology[0]}" == "$GITHUB_SHA" ]] && \
               [[ "${head_topology[1]}" == "$feature" ]] && \
               matches_exactly expected actual && \
               matches_exactly expected_feature feature_actual; then
              exact=true
            fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify custody source and synthetic fixture
        run: |
          pnpm --filter @research-cockpit/filing-payload-custody typecheck
          pnpm --filter @research-cockpit/filing-payload-custody test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-payload-custody-fixtures

      - name: Run filing payload custody acceptance
        # Cycle 3d Windows ACL, CI, API-fixture, and parser-timeout routing is
        # non-evidence only; custody still mints exact-HEAD evidence.
        env:
          CI: "true"
          FILING_PAYLOAD_CUSTODY_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
        if: ${{ steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' }}
        run: pnpm filing-payload-custody:acceptance

      - name: Verify canonical evidence against the exact commit
        if: ${{ steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' }}
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
        run: |
          evidence_sha256="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          pnpm filing-payload-custody:evidence-review -- \
            --evidence "$EVIDENCE_PATH" \
            --evidence-sha256 "$evidence_sha256" \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload filing payload custody evidence
        if: ${{ success() && steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filing-payload-custody-evidence-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
          if-no-files-found: error
          retention-days: 30
