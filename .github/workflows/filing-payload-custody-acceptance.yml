      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify custody source and synthetic fixture
        run: |
          pnpm --filter @research-cockpit/filing-payload-custody typecheck
          pnpm --filter @research-cockpit/filing-payload-custody test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-payload-custody-fixtures

      - name: Run filing payload custody acceptance
        # Cycle 3d Windows ACL, CI, API-fixture, and parser-timeout routing is
        # non-evidence only; custody still mints exact-HEAD evidence.
        env:
          CI: "true"
          FILING_PAYLOAD_CUSTODY_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
        if: ${{ steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' && steps.cycle3la1_route.outputs.exact != 'true' && steps.cycle3ma1_route.outputs.exact != 'true' && steps.cycle3ma2_route.outputs.exact != 'true' && steps.cycle3ma3_route.outputs.exact != 'true' && steps.cycle3ma4_route.outputs.exact != 'true' && steps.cycle3ma5_route.outputs.exact != 'true' && steps.cycle3ma6_route.outputs.exact != 'true' && steps.cycle3ma7_route.outputs.exact != 'true' && steps.cycle3ha4_route.outputs.exact != 'true' && steps.cycle3ha5_route.outputs.exact != 'true' && steps.cycle3ha6_route.outputs.exact != 'true' }}
        run: pnpm filing-payload-custody:acceptance

      - name: Verify canonical evidence against the exact commit
        if: ${{ steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' && steps.cycle3la1_route.outputs.exact != 'true' && steps.cycle3ma1_route.outputs.exact != 'true' && steps.cycle3ma2_route.outputs.exact != 'true' && steps.cycle3ma3_route.outputs.exact != 'true' && steps.cycle3ma4_route.outputs.exact != 'true' && steps.cycle3ma5_route.outputs.exact != 'true' && steps.cycle3ma6_route.outputs.exact != 'true' && steps.cycle3ma7_route.outputs.exact != 'true' && steps.cycle3ha4_route.outputs.exact != 'true' && steps.cycle3ha5_route.outputs.exact != 'true' && steps.cycle3ha6_route.outputs.exact != 'true' }}
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
        run: |
          evidence_sha256="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          pnpm filing-payload-custody:evidence-review -- \
            --evidence "$EVIDENCE_PATH" \
            --evidence-sha256 "$evidence_sha256" \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload filing payload custody evidence
        if: ${{ success() && steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' && steps.cycle3la1_route.outputs.exact != 'true' && steps.cycle3ma1_route.outputs.exact != 'true' && steps.cycle3ma2_route.outputs.exact != 'true' && steps.cycle3ma3_route.outputs.exact != 'true' && steps.cycle3ma4_route.outputs.exact != 'true' && steps.cycle3ma5_route.outputs.exact != 'true' && steps.cycle3ma6_route.outputs.exact != 'true' && steps.cycle3ma7_route.outputs.exact != 'true' && steps.cycle3ha4_route.outputs.exact != 'true' && steps.cycle3ha5_route.outputs.exact != 'true' && steps.cycle3ha6_route.outputs.exact != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filing-payload-custody-evidence-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
          if-no-files-found: error
          retention-days: 30
