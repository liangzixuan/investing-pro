            "A" "apps/web/src/lib/personal-watchlist-filings-api.test.ts"
            "A" "apps/web/src/lib/personal-watchlist-filings-api.ts"
            "M" "docs/CURRENT_WORK.md"
            "M" "docs/PERSONAL_PRODUCT_BREADTH_ROADMAP.md"
            "A" "docs/WATCHLIST_SEC_FILINGS.md"
            "M" "packages/contracts/src/index.ts"
            "A" "packages/contracts/src/personal-watchlist-filings.ts"
            "M" "scripts/verify-boundaries.ts"
          )
          matches_exactly() {
            local -n expected_values="$1"
            local -n actual_values="$2"
            if [[ "${#actual_values[@]}" != "${#expected_values[@]}" ]]; then return 1; fi
            for index in "${!expected_values[@]}"; do
              if [[ "${actual_values[$index]}" != "${expected_values[$index]}" ]]; then return 1; fi
            done
          }
          if git cat-file -e "$cycle2z_baseline^{commit}" && \
