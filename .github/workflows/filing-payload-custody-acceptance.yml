permissions:
  contents: read

concurrency:
  group: filing-payload-custody-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Synthetic filing payload custody (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify exact Cycle 3k-a1 non-evidence routing closure
        id: cycle3ka1_route
        shell: bash
        run: |
          exact=false
          cycle2z_baseline="62c01dafe305ddd43c75688e0225163b3abdf6df"
          prior_closure="fa63a5de52c569857abcdc7f2b8995db800ced50"
          feature="5dd44acdbe3159d58d9f8983093d3afbb2d33ae5"
          expected=(
            "M" ".github/workflows/filing-parser-acceptance.yml"
            "M" ".github/workflows/filing-parser-cross-engine-execution-acceptance.yml"
            "M" ".github/workflows/filing-payload-custody-acceptance.yml"
            "M" "README.md"
            "M" "docs/BUILD_ROADMAP.md"
            "A" "docs/CURRENT_WORK.md"
            "M" "docs/PERSONAL_PRODUCT_BREADTH_ROADMAP.md"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.test.ts"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.test.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.ts"
          )
          matches_exactly() {
            if [[ "${#actual[@]}" != "${#expected[@]}" ]]; then
              return 1
            fi
            for index in "${!expected[@]}"; do
              if [[ "${actual[$index]}" != "${expected[$index]}" ]]; then
                return 1
              fi
            done
          }
          if git cat-file -e "$cycle2z_baseline^{commit}" && \
             git cat-file -e "$prior_closure^{commit}" && \
             git cat-file -e "$feature^{commit}"; then
            read -r -a head_topology <<< "$(git rev-list --parents -n 1 HEAD)"
            read -r -a feature_topology <<< "$(git rev-list --parents -n 1 "$feature")"
            mapfile -d '' -t actual < <(
              git diff --name-status --no-renames -z "$feature" HEAD --
            )
            if [[ "$(git merge-base "$cycle2z_baseline" HEAD)" == "$cycle2z_baseline" ]] && \
               [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline".."$feature")" == "65" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline".."$feature")" == "65" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline"..HEAD)" == "66" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline"..HEAD)" == "66" ]] && \
               [[ "${#feature_topology[@]}" == "2" ]] && \
               [[ "${feature_topology[0]}" == "$feature" ]] && \
               [[ "${feature_topology[1]}" == "$prior_closure" ]] && \
               [[ "${#head_topology[@]}" == "2" ]] && \
               [[ "${head_topology[0]}" == "$GITHUB_SHA" ]] && \
               [[ "${head_topology[1]}" == "$feature" ]] && \
               matches_exactly; then
              exact=true
            fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Classify exact partial Cycle 3k-a2 non-evidence routing closure
        id: cycle3ka2_route
        shell: bash
        run: |
          exact=false
          cycle2z_baseline="62c01dafe305ddd43c75688e0225163b3abdf6df"
          prior_closure="2f5bab2833acc6367fa4c1e5b20f3e15d6d3ec6e"
          feature="ad168082454aa243431138a3e3a300d048bde2d7"
          expected=(
            "M" ".github/workflows/filing-parser-acceptance.yml"
            "M" ".github/workflows/filing-parser-cross-engine-execution-acceptance.yml"
            "M" ".github/workflows/filing-payload-custody-acceptance.yml"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.test.ts"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.test.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.ts"
          )
          expected_feature=(
            "M" "README.md"
            "M" "apps/api/package.json"
            "A" "apps/api/src/personal-sec-financial-provider.test.ts"
            "A" "apps/api/src/personal-sec-financial-provider.ts"
            "M" "apps/api/src/workspace-app.ts"
            "M" "apps/api/src/workspace-composition-root.test.ts"
            "M" "apps/api/src/workspace-composition-root.ts"
