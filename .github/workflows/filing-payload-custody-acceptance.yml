name: Filing payload custody acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/filing-parser-acceptance.yml
      - .github/workflows/filing-payload-custody-acceptance.yml
      - LICENSE_POLICY.md
      - THIRD_PARTY_NOTICES.md
      - fixtures/synthetic/filing-payload-custody/**
      - package.json
      - packages/filing-parser/src/filing-parser-evidence-verifier.test.ts
      - packages/filing-parser/src/filing-parser-evidence-verifier.ts
      - packages/filing-payload-custody/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/verify-boundaries.ts
      - scripts/verify-filing-payload-custody-fixtures.ts
      - tsconfig.base.json
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/filing-parser-acceptance.yml
      - .github/workflows/filing-payload-custody-acceptance.yml
      - LICENSE_POLICY.md
      - THIRD_PARTY_NOTICES.md
      - fixtures/synthetic/filing-payload-custody/**
      - package.json
      - packages/filing-parser/src/filing-parser-evidence-verifier.test.ts
      - packages/filing-parser/src/filing-parser-evidence-verifier.ts
      - packages/filing-payload-custody/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/verify-boundaries.ts
      - scripts/verify-filing-payload-custody-fixtures.ts
      - tsconfig.base.json

permissions:
  contents: read

concurrency:
  group: filing-payload-custody-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Synthetic filing payload custody (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify custody source and synthetic fixture
        run: |
          pnpm --filter @research-cockpit/filing-payload-custody typecheck
          pnpm --filter @research-cockpit/filing-payload-custody test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-payload-custody-fixtures

      - name: Run filing payload custody acceptance
        env:
          CI: "true"
          FILING_PAYLOAD_CUSTODY_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
        run: pnpm filing-payload-custody:acceptance

      - name: Verify canonical evidence against the exact commit
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
        run: |
          evidence_sha256="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          pnpm filing-payload-custody:evidence-review -- \
            --evidence "$EVIDENCE_PATH" \
            --evidence-sha256 "$evidence_sha256" \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload filing payload custody evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filing-payload-custody-evidence-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-filing-payload-custody-v1.json
          if-no-files-found: error
          retention-days: 30
