            read -r -a head_topology <<< "$(git rev-list --parents -n 1 HEAD)"
            read -r -a feature_topology <<< "$(git rev-list --parents -n 1 "$feature")"
            mapfile -d '' -t actual < <(
              git diff --name-status --no-renames -z "$feature" HEAD --
            )
            mapfile -d '' -t feature_actual < <(
              git diff --name-status --no-renames -z "$prior_closure" "$feature" --
            )
            if [[ "$(git merge-base "$cycle2z_baseline" HEAD)" == "$cycle2z_baseline" ]] && \
