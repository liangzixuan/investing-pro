name: Filing parser cross-engine execution acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/filing-parser-cross-engine-execution-acceptance.yml
      - fixtures/synthetic/filing-parser-cross-engine-execution/**
      - LICENSE_POLICY.md
      - package.json
      - packages/filing-fact-normalization/**
      - packages/filing-parser/**
      - packages/filing-parser-cross-engine-execution/**
      - packages/filing-parser-cross-engine-execution-acceptance/**
      - packages/filing-parser-normalization-execution/**
      - packages/filing-parser-normalization-execution-acceptance/**
      - packages/filing-parser-normalization-handoff/**
      - packages/filing-payload-custody/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/verify-boundaries.ts
      - scripts/verify-filing-parser-cross-engine-execution-fixtures.ts
      - THIRD_PARTY_NOTICES.md
      - tsconfig.base.json

permissions:
  contents: read

concurrency:
  group: filing-parser-cross-engine-execution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Cross-engine parser execution (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Classify exact post-evidence legacy bridge
        id: legacy_bridge
        if: ${{ success() }}
        shell: bash
        run: |
          exact=false
          read -r -a topology <<< "$(git rev-list --parents -n 1 HEAD)"
          if [[ "${#topology[@]}" == "2" ]] && \
             [[ "${topology[1]}" == "5d61868e6075865b32640ddaceb845ac9dbc69f3" ]]; then
            expected=(
              "M"
              ".github/workflows/filing-parser-cross-engine-execution-acceptance.yml"
              "M"
              "packages/filing-parser/src/filing-parser-evidence-verifier.test.ts"
              "M"
              "packages/filing-parser/src/filing-parser-evidence-verifier.ts"
              "M"
              "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.test.ts"
              "M"
              "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.ts"
            )
            mapfile -d '' -t actual < <(git diff --name-status --no-renames -z HEAD^ HEAD --)
            if [[ "${#actual[@]}" == "${#expected[@]}" ]]; then
              exact=true
              for index in "${!expected[@]}"; do
                if [[ "${actual[$index]}" != "${expected[$index]}" ]]; then
                  exact=false
                fi
              done
            fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"
      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.13
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify execution and evidence sources
        run: |
          pnpm --filter @research-cockpit/filing-parser-normalization-execution typecheck
          pnpm --filter @research-cockpit/filing-parser-normalization-execution test
          pnpm --filter @research-cockpit/filing-parser-normalization-execution test:worker
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution typecheck
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution test
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution test:worker
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution-acceptance typecheck
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution-acceptance test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-parser-cross-engine-execution-fixtures
      - name: Run cross-engine parser execution acceptance
        if: ${{ steps.legacy_bridge.outputs.exact != 'true' }}
        env:
          CI: "true"
          FILING_PARSER_CROSS_ENGINE_EXECUTION_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-cross-engine-execution-v3.json
        run: pnpm filing-parser-cross-engine-execution:acceptance
      - name: Independently review canonical evidence against the exact commit
        if: ${{ steps.legacy_bridge.outputs.exact != 'true' }}
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-cross-engine-execution-v3.json
        run: |
          evidence_sha256="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          pnpm filing-parser-cross-engine-execution:evidence-review -- \
            --artifact "filing-parser-cross-engine-execution-evidence-v3-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" \
            --evidence "$EVIDENCE_PATH" \
            --evidence-sha256 "$evidence_sha256" \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID"
      - name: Record exact post-evidence legacy bridge
        if: ${{ steps.legacy_bridge.outputs.exact == 'true' }}
        run: |
          test ! -e "$RUNNER_TEMP/research-cockpit-filing-parser-cross-engine-execution-v3.json"
          echo "Cycle 2m canonical v3 evidence remains anchored at 5d61868e6075865b32640ddaceb845ac9dbc69f3; no replacement artifact was generated."
      - name: Upload filing parser cross-engine execution evidence
        if: ${{ success() && steps.legacy_bridge.outputs.exact != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filing-parser-cross-engine-execution-evidence-v3-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-filing-parser-cross-engine-execution-v3.json
          if-no-files-found: error
          retention-days: 30
