                 [[ "$successor_count" == "1" ]] && \
                 [[ "$first_parent_count" == "1" ]] && \
                 [[ "${#topology[@]}" == "2" ]] && \
                 [[ "${topology[0]}" == "$GITHUB_SHA" ]] && \
                 [[ "${topology[1]}" == "$baseline" ]] && \
                 matches_exactly expected actual; then
                exact=true
              fi
            fi
