          echo "exact=$exact" >> "$GITHUB_OUTPUT"
          if [[ "$required" == "true" && "$exact" != "true" ]]; then
            echo "Cycle 2u protected surfaces changed outside the exact personal fact-normalization source transition; refusing inherited evidence routing." >&2
