          if git merge-base --is-ancestor "$baseline" HEAD; then
            mapfile -d '' -t protected_actual < <(
              git diff --name-only --no-renames -z "$baseline" HEAD -- "${protected[@]}"
            )
            if [[ "${#protected_actual[@]}" != "0" ]]; then
              required=true
              head_revision="$(git rev-parse HEAD)"
              read -r -a topology <<< "$(git rev-list --parents -n 1 HEAD)"
              merge_base="$(git merge-base "$baseline" HEAD)"
              successor_count="$(git rev-list --count "$baseline"..HEAD)"
              first_parent_count="$(git rev-list --first-parent --count "$baseline"..HEAD)"
