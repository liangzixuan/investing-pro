            local -n expected_values="$1"
            local -n actual_values="$2"
            if [[ "${#actual_values[@]}" != "${#expected_values[@]}" ]]; then
              return 1
            fi
            for index in "${!expected_values[@]}"; do
              if [[ "${actual_values[$index]}" != "${expected_values[$index]}" ]]; then
                return 1
              fi
            done
