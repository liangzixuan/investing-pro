        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.13
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify execution and evidence sources
        run: |
          pnpm --filter @research-cockpit/filing-parser-normalization-execution typecheck
          pnpm --filter @research-cockpit/filing-parser-normalization-execution test
          pnpm --filter @research-cockpit/filing-parser-normalization-execution test:worker
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution typecheck
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution test
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution test:worker
          pnpm --filter @research-cockpit/filing-quality-measurement typecheck
          pnpm --filter @research-cockpit/filing-quality-measurement test
          pnpm --filter @research-cockpit/filing-quality-precommitment typecheck
          pnpm --filter @research-cockpit/filing-quality-precommitment test
          pnpm --filter @research-cockpit/filing-parser-quality-composition typecheck
          pnpm --filter @research-cockpit/filing-parser-quality-composition test
          pnpm --filter @research-cockpit/filing-payload-custody typecheck
          pnpm --filter @research-cockpit/filing-payload-custody test
          pnpm --filter @research-cockpit/personal-filing-corpus typecheck
          pnpm --filter @research-cockpit/personal-filing-corpus test
          pnpm --filter @research-cockpit/filing-parser-custody-quality-composition typecheck
          pnpm --filter @research-cockpit/filing-parser-custody-quality-composition test
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution-acceptance typecheck
          pnpm --filter @research-cockpit/filing-parser-cross-engine-execution-acceptance test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-parser-cross-engine-execution-fixtures
      - name: Run cross-engine parser execution acceptance
        if: ${{ steps.cycle2o_source.outputs.exact == 'true' }}
        env:
          CI: "true"
          FILING_PARSER_CROSS_ENGINE_EXECUTION_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-cross-engine-execution-v5.json
        run: pnpm filing-parser-cross-engine-execution:acceptance
      - name: Independently review canonical evidence against the exact commit
        if: ${{ steps.cycle2o_source.outputs.exact == 'true' }}
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-cross-engine-execution-v5.json
        run: |
          evidence_sha256="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          pnpm filing-parser-cross-engine-execution:evidence-review -- \
            --artifact "filing-parser-cross-engine-execution-evidence-v5-${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}" \
            --evidence "$EVIDENCE_PATH" \
            --evidence-sha256 "$evidence_sha256" \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID"
      - name: Record exact non-evidence route or reject an unrecognized route
        if: ${{ steps.cycle2o_source.outputs.exact != 'true' }}
        run: |
          test ! -e "$RUNNER_TEMP/research-cockpit-filing-parser-cross-engine-execution-v1.json"
          test ! -e "$RUNNER_TEMP/research-cockpit-filing-parser-cross-engine-execution-v2.json"
          test ! -e "$RUNNER_TEMP/research-cockpit-filing-parser-cross-engine-execution-v3.json"
          test ! -e "$RUNNER_TEMP/research-cockpit-filing-parser-cross-engine-execution-v4.json"
          test ! -e "$RUNNER_TEMP/research-cockpit-filing-parser-cross-engine-execution-v5.json"
          if [[ "${{ steps.cycle2x_source.outputs.exact }}" == "true" ]]; then
            if [[ "${{ steps.cycle2x_source.outputs.cycle3b }}" == "true" ]]; then
              echo "Cycle 3b is an authenticated personal dossier-composition route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
            elif [[ "${{ steps.cycle2x_source.outputs.cycle3a }}" == "true" ]]; then
              echo "Cycle 3a is a personal local owner-session route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
            elif [[ "${{ steps.cycle2x_source.outputs.cycle2z }}" == "true" ]]; then
              echo "Cycle 2z is a personal local selected-fact release route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
            else
              echo "Cycle 2x is a personal local quality-measurement route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
            fi
            exit 0
          fi
          if [[ "${{ steps.cycle2w_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2w is a personal local raw fact-extraction route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
            exit 0
          fi
          if [[ "${{ steps.cycle2v_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2v is a personal local fact-comparison route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
          elif [[ "${{ steps.cycle2u_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2u is a personal local fact-normalization route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
          elif [[ "${{ steps.cycle2s_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2s is a personal local payload-custody route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
          elif [[ "${{ steps.cycle2r_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2r is a personal local payload-identity route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
          elif [[ "${{ steps.cycle2q_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2q is a personal-use profile route only. Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
          elif [[ "${{ steps.cycle2p_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2o canonical v5 evidence remains anchored at 472cc10b8df90bee01925b2efd4fbcb614d7590c; no replacement artifact was generated."
          elif [[ "${{ steps.cycle2n_source.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2n canonical v4 evidence remains anchored at 1d7dee56c66c1ad0f5d612603567adf2589e0930; no replacement artifact was generated."
          elif [[ "${{ steps.admission_validity_bridge.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2n canonical v4 evidence remains anchored at 1d7dee56c66c1ad0f5d612603567adf2589e0930; no replacement artifact was generated."
          elif [[ "${{ steps.legacy_bridge.outputs.exact }}" == "true" ]]; then
            echo "Cycle 2m canonical v3 evidence remains anchored at 5d61868e6075865b32640ddaceb845ac9dbc69f3; no replacement artifact was generated."
          else
            echo "Unrecognized evidence source route; refusing to mint or silently skip evidence." >&2
            exit 1
          fi
      - name: Upload filing parser cross-engine execution evidence
        if: ${{ success() && steps.cycle2o_source.outputs.exact == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filing-parser-cross-engine-execution-evidence-v5-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-filing-parser-cross-engine-execution-v5.json
          if-no-files-found: error
          retention-days: 30
