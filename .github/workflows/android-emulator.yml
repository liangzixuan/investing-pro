name: Android emulator

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator (API 36, shard ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: "0"
          - shard: "1"
    env:
      ANDROID_TEST_SHARD: ${{ matrix.shard }}
      INVESTMENT_CLIENT_PROFILE: disconnected
      INVESTMENT_BUILD_SHA: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Install Android SDK components
        timeout-minutes: 10
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;35.0.0" \
            "emulator" "system-images;android-36;google_apis;x86_64"

      - name: Enable emulator acceleration
        run: |
          set -x
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Bundle and sync the disconnected Android app
        timeout-minutes: 5
        run: pnpm --filter @research-cockpit/web android:sync

      - name: Bundle the isolated managed UI test fixture
        timeout-minutes: 5
        run: pnpm --filter @research-cockpit/web exec vite build --config vite.android-test.config.ts

      - name: Test the packaged app on Android
        timeout-minutes: 25
        working-directory: apps/web/android
        run: |
          bash ./gradlew --no-daemon --console=plain \
            -PinvestmentClientProfile=disconnected \
            -Pandroid.testInstrumentationRunnerArguments.numShards=2 \
            -Pandroid.testInstrumentationRunnerArguments.shardIndex="$ANDROID_TEST_SHARD" \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.testInstrumentationRunnerArguments.expectedSourceSha="$GITHUB_SHA" \
            :app:pixel2Api36DebugAndroidTest

      - name: Verify native tests actually ran
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile

          reports = sorted(Path("apps/web/android/app/build/outputs/androidTest-results/managedDevice").rglob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No managed-device JUnit reports were produced.")
          executed = set()
          for report in reports:
              result = ET.parse(report).getroot()
              for suite in result.iter("testsuite"):
                  if any(int(suite.get(field, "0")) != 0 for field in ("failures", "errors", "skipped")):
                      raise SystemExit("Native tests reported a failure, error or skip.")
              for case in result.iter("testcase"):
                  if any(case.find(field) is not None for field in ("failure", "error", "skipped")):
                      raise SystemExit("A native test did not pass.")
                  identity = (case.get("classname"), case.get("name"))
                  if not all(identity):
                      raise SystemExit("A native test has no class or method identity.")
                  executed.add(identity)
          if not executed:
              raise SystemExit("The native shard did not execute any tests.")
          apk_root = Path("apps/web/android/app/build/outputs/apk")
          fixture_prefix = "assets/managed-workspace/"
          test_providers = (
              "local.investment.personal.SavedWatchlistTestDocumentsProvider",
              "local.investment.personal.SavedWatchlistTestObservationProvider",
          )
          test_authorities = (
              "local.investment.personal.test.watchlist-export",
              "local.investment.personal.test.watchlist-export-observer",
          )
          provider_descriptors = [("L" + provider.replace(".", "/") + ";").encode("utf-8") for provider in test_providers]
          def manifest_contains(contents, marker):
              return any((marker + "\0").encode(encoding) in contents for encoding in ("utf-8", "utf-16le"))
          def dex_files(archive):
              return [archive.read(name) for name in archive.namelist() if "/" not in name and name.startswith("classes") and name.endswith(".dex")]
          with ZipFile(apk_root / "debug/app-debug.apk") as app:
              if any(name.startswith(fixture_prefix) for name in app.namelist()):
                  raise SystemExit("Synthetic managed fixture entered the app APK.")
              if any(manifest_contains(app.read("AndroidManifest.xml"), marker) for marker in test_providers + test_authorities) or any(descriptor in contents for descriptor in provider_descriptors for contents in dex_files(app)):
                  raise SystemExit("Synthetic export provider entered the app APK.")
          with ZipFile(apk_root / "androidTest/debug/app-debug-androidTest.apk") as tests:
              if fixture_prefix + "index.html" not in tests.namelist():
                  raise SystemExit("Synthetic managed fixture is missing from the test APK.")
              if not all(manifest_contains(tests.read("AndroidManifest.xml"), marker) for marker in test_providers + test_authorities) or not all(any(descriptor in contents for contents in dex_files(tests)) for descriptor in provider_descriptors):
                  raise SystemExit("Synthetic export provider is missing from the test APK.")
          receipt = {
              "sourceSha": os.environ["GITHUB_SHA"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "shard": os.environ["ANDROID_TEST_SHARD"],
              "numShards": 2,
              "profile": "disconnected",
              "apkCustody": True,
              "cases": sorted(executed),
          }
          receipt_path = Path("apps/web/android/app/build/outputs/androidTest-results/managedDevice/shard-verification.json")
          receipt_path.write_text(json.dumps(receipt, sort_keys=True), encoding="utf-8")
          print(f"Verified {len(executed)} native shard tests with no failures, errors or skips and isolated APK fixtures.")
          PY

      - name: Retain Android test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-emulator-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/web/android/app/build/reports/androidTests/**
            apps/web/android/app/build/outputs/androidTest-results/**
            apps/web/android/app/build/outputs/managed_device_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14

  verify-android-emulator:
    name: Android emulator (API 36)
    needs: android-emulator
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require both native shard jobs to succeed
        env:
          SHARD_JOBS_RESULT: ${{ needs.android-emulator.result }}
        run: test "$SHARD_JOBS_RESULT" = success

      - name: Download native shard 0 results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-emulator-shard-0-${{ github.run_attempt }}
          path: android-shards/shard-0
          digest-mismatch: error

      - name: Download native shard 1 results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-emulator-shard-1-${{ github.run_attempt }}
          path: android-shards/shard-1
          digest-mismatch: error

      - name: Verify the complete native test union
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import xml.etree.ElementTree as ET

          expected_tests = {
              "local.investment.personal.WatchlistDraftFilePolicyInstrumentedTest": {
                  "derivesOnlyTheFixedFilenameAndMimeFromCaptureMetadata",
                  "rejectsCallerFilenameUnknownMetadataAndInvalidBaseVersions",
                  "validatesRealUtcCalendarTimeWithoutNormalizingTheName",
                  "rejectsDifferentFramingAndFilenameBeforeWriting",
                  "inheritedWriterEncodingRejectsOversizeAndMalformedUtf16",
              },
              "local.investment.personal.CompanyReportPolicyInstrumentedTest": {
                  "acceptsCurrentReportSchemaAndRefusesOldSchemaOrIdentity",
              },
              "local.investment.personal.DisconnectedAppInstrumentedTest": {
                  "packagedAppLaunchesWithDisconnectedGuards",
                  "localNavigationAndHardwareBackKeepWorkspaceLocked",
                  "recreatedActivityReloadsPackagedAppAndBackStillWorks",
              },
              "local.investment.personal.ManagedWorkspaceInstrumentedTest": {
                  "annualBackPreservesDraftAndRootBackDoesNothing",
                  "annualBackAbortsPendingReadAndDiscardsLateResult",
                  "backgroundResumePreservesDraftAndAnnualCancellation",
                  "annualRefreshFailureKeepsReportUntilExplicitRecovery",
                  "catalogStartupFailureRecoversWithoutReloadOrDraftLoss",
                  "marketsLoadCancelAndNavigationPreserveDraft",
                  "selectedMarketPriceLoadRefreshAndCancelPreserveDraft",
                  "rawCloseComparisonUsesObservedDatesAndPreservesDraft",
                  "eodLoadCancelAndBackPreserveDraftAndDiscardLateResult",
                  "companyPriceRangesRetainDatesAndFenceCancelledVisits",
                  "watchlistComparisonUsesLoadedSharedDatesAndPreservesDraft",
                  "switchingResearchPanelsPreservesDraftAndDiscardsLateAnnual",
                  "companyFilingsPagingCancelAndBackPreserveDraft",
                  "companyNoteDraftReviewSaveAndReloadPreservesIdentity",
                  "annualEvidenceNoteDraftReviewSaveAndReloadPreservesSource",
                  "annualCashHistoryKeepsExactPeriodsAndRetiresWithSession",
                  "annualOperatingHistoryRetainsReplacesAndRetiresExactPeriods",
                  "annualLiquidityHistoryRetainsDatesAndRefusals",
                  "annualBalanceSheetCapturesExactTotalsAndRetiresLateRefresh",
                  "annualOperatingResultsRetainFactsDraftAndRetireWithSession",
                  "annualFinancialReviewRequiresPreviewAndExplicitSave",
                  "annualStatementsPreviewAppendSaveAndCapturePreserveSources",
                  "authoredValuationPreviewSaveReportAndRetirementPreserveBoundaries",
                  "savedValuationInputsRequireReviewSaveReopenAndExplicitCalculation",
                  "valuationPriceComparisonPreviewSaveFreshReadAndReportPreserveSources",
                  "savedWatchlistExportUsesSystemPickerAndPreservesDraft",
                  "watchlistDraftFileUsesSystemExportImportAndExplicitRestore",
                  "watchlistDraftFileRejectsAnotherAccountAndRetiresChooser",
                  "priceComparisonNoteDraftReviewSaveAndReloadPreservesSource",
                  "priceStudiesPreviewSaveReloadAndReportPreserveRawSource",
                  "financialScreenExplicitRunInspectionAndResearchBackPreserveDraft",
                  "screenComparisonKeepsIndependentStatementsSourcesAndResearchBack",
                  "companyLinkDirectEntryAndBackPreserveDraft",
                  "watchlistReplayReviewAndFailedReadPreserveDraft",
                  "signOutReviewKeepsDraftAndUpdatesAfterSave",
                  "uncertainSignOutReviewClearsLocalStateAndFencesLateReceipt",
                  "beaAgendaRefreshCancelAndNavigationPreserveDraft",
                  "beaAgendaComparisonKeepsOriginalWindowsAndRetainedPair",
                    "thesisReviewPreviewAppendSaveAndReloadPreservesDraft",
                  "loadedCompanySnapshotKeepsSeparateEvidenceWithoutAutomaticReads",
                  "preparedCompanyReportUsesSystemPickerAndPreservesDraft",
                  "beaSessionExpiryClearsAgendaAndFencesLateResponse",
                  "fedAnnouncementsRetainDatesCancelAndRetireWithSession",
                  "watchlistAnnualComparisonKeepsSeparateFilingsAndPreservesDraft",
                  "operatingComparisonNoteKeepsSeparateSourcesAndExplicitSave",
                  "researchFollowupsSaveResearchAndCompleteAcrossSessions",
                  "dailyResearchReviewKeepsDraftAndCompletesThroughResearch",
                  "marketsDayViewKeepsSourcesSeparateAndRetiresLateResponses",
                  "researchFollowupsReplayAndSessionRetirementFenceLateReplies",
                  "portfolioLedgerKeepsExactFifoAndIndependentSave",
              },
          }
          required = {(class_name, method) for class_name, methods in expected_tests.items() for method in methods}
          if len(required) != 59:
              raise SystemExit("The original 59 native test requirements changed.")
          # Keep every original requirement and require the new group journey too.
          required.add((
              "local.investment.personal.ManagedWorkspaceInstrumentedTest",
              "watchlistFilingsReviewKeepsPacketsNotesAndRetiresLateChecks",
          ))
          if len(required) != 60:
              raise SystemExit("The filing-review journey must extend the original 59 tests.")
          required.update({
              ("local.investment.personal.CompanyReportHtmlPolicyInstrumentedTest", method)
              for method in {
                  "admitsTheFixedHtmlMetadataAndCompleteEnvelope",
                  "refusesUnknownOptionsCrossFormatPurposeAndUnsafeFilename",
                  "reusesTheJsonCalendarAndExactChosenIdentity",
                  "refusesChangedHeadCspStyleIdentityOrIncompleteEnvelope",
                  "inheritsTheEightMibStrictUtf8WriterBoundary",
              }
          })
          if len(required) != 65:
              raise SystemExit("The HTML policy cases must extend all 60 existing native tests.")
          required.update({
              ("local.investment.personal.FinancialScreenRecipePolicyInstrumentedTest", method)
              for method in {
                  "acceptsFixedRecipeMetadataAndCurrentBody",
                  "rejectsUnknownCrossPurposeAndMismatchedDestinationMetadata",
                  "rejectsVersionTimestampAndNonClosedRecipeFraming",
                  "sharedWriterEnforcesExactUtf8LimitAndRejectsMalformedText",
                  "validatesCalendarBoundariesAndKeepsMimeAndOptionsFixed",
              }
          })
          required.add((
              "local.investment.personal.ManagedWorkspaceInstrumentedTest",
              "financialScreenRecipeSystemPickerReviewApplyRunAndWatchlistSave",
          ))
          if len(required) != 71:
              raise SystemExit("Recipe policy and system-picker journey must extend all 65 existing native tests.")
          # Preserve all 71 existing requirements and add contextual assessment.
          required.add((
              "local.investment.personal.ManagedWorkspaceInstrumentedTest",
              "followupAssessmentInCompanyReturnsToReviewAndSave",
          ))
          if len(required) != 72:
              raise SystemExit("The contextual assessment journey must extend all 71 existing native tests.")
          # Preserve every original72 requirement and add the holding handoff.
          required.add((
              "local.investment.personal.ManagedWorkspaceInstrumentedTest",
              "portfolioHoldingReviewAppendsWatchlistAndKeepsLedgerThroughBack",
          ))
          if len(required) != 73:
              raise SystemExit("The holding Watchlist journey must extend all 72 existing native tests.")
          # Keep every original73 case and require the complete saved-report revisit.
          required.add((
              "local.investment.personal.CompanyReportRevisitInstrumentedTest",
              "savedReportRevisitUsesLargeFileChooserAndExplicitWatchlistSave",
          ))
          if len(required) != 74:
              raise SystemExit("The report revisit journey must extend all 73 existing native tests.")
          # Preserve all 74 existing cases and add dated Portfolio close review.
          required.add((
              "local.investment.personal.ManagedWorkspaceInstrumentedTest",
              "portfolioDatedClosesKeepLedgerThroughCancelResearchAndSeparateSave",
          ))
          if len(required) != 75:
              raise SystemExit("Dated holdings review must extend all 74 existing native tests.")
          # Preserve all 75 existing cases and require the complete Portfolio report export.
          required.update({
              ("local.investment.personal.PortfolioReviewReportPolicyInstrumentedTest", method)
              for method in {
                  "admitsTheFixedHtmlMetadataAndCompleteEnvelope",
                  "refusesUnknownOptionsCrossFormatPurposeAndUnsafeFilename",
                  "reusesTheCompleteUtcCalendarAndExactChosenFilename",
                  "refusesChangedHeadCspStyleIdentityOrIncompleteEnvelope",
                  "inheritsTheEightMibStrictUtf8WriterBoundary",
              }
          })
          required.add((
              "local.investment.personal.PortfolioReviewReportInstrumentedTest",
              "portfolioReportSystemPickerKeepsExactValuesSourcesAndSeparateSaveThroughBack",
          ))
          if len(required) != 81:
              raise SystemExit("Portfolio report policy and export journey must extend all 75 existing native tests.")

          required.add((
              "local.investment.personal.CompanySnapshotLoadingInstrumentedTest",
              "explicitSnapshotLoadCancelsLateFilingsAndKeepsDraftThroughBackAndSeparateSave",
          ))
          if len(required) != 82:
              raise SystemExit("Expected exactly 82 declared native tests.")
          required.add((
              "local.investment.personal.ManagedWorkspaceInstrumentedTest",
              "followupsReviewSessionKeepsChosenOrderThroughCompanyBackAndSeparateSave",
          ))
          if len(required) != 83:
              raise SystemExit("The daily Follow-ups review must extend all 82 existing native tests.")
          required.add((
              "local.investment.personal.FollowupAssessmentNoteInstrumentedTest",
              "followupAssessmentAppendsExactCompanyNoteThroughBackAndSeparateSaves",
          ))
          if len(required) != 84:
              raise SystemExit("The assessment-to-note journey must extend all 83 existing native tests.")
          combined = set()
          for shard in ("0", "1"):
              root = Path("android-shards") / ("shard-" + shard)
              receipts = list(root.rglob("shard-verification.json"))
              reports = sorted(root.rglob("TEST-*.xml"))
              if len(receipts) != 1 or not reports:
                  raise SystemExit("A distinct native shard receipt or JUnit report is missing.")
              executed = set()
              for report in reports:
                  result = ET.parse(report).getroot()
                  for suite in result.iter("testsuite"):
                      if any(int(suite.get(field, "0")) != 0 for field in ("failures", "errors", "skipped")):
                          raise SystemExit("A native shard reported a failure, error or skip.")
                  for case in result.iter("testcase"):
                      if any(case.find(field) is not None for field in ("failure", "error", "skipped")):
                          raise SystemExit("A native shard test did not pass.")
                      identity = (case.get("classname"), case.get("name"))
                      if not all(identity):
                          raise SystemExit("A native shard test identity is missing.")
                      executed.add(identity)
              if not executed or combined.intersection(executed):
                  raise SystemExit("Native shard case sets are empty or overlap.")
              expected_receipt = {
                  "sourceSha": os.environ["GITHUB_SHA"],
                  "runId": os.environ["GITHUB_RUN_ID"],
                  "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "shard": shard,
                  "numShards": 2,
                  "profile": "disconnected",
                  "apkCustody": True,
                  "cases": [list(identity) for identity in sorted(executed)],
              }
              if json.loads(receipts[0].read_text(encoding="utf-8")) != expected_receipt:
                  raise SystemExit("Native shard source, run, attempt, partition or APK custody receipt does not match.")
              combined.update(executed)
          if combined != required:
              raise SystemExit("The native shard union does not match the complete declared test suite.")
          print(f"Verified two distinct passing native shards, APK custody and all {len(required)} declared native tests.")
          PY
