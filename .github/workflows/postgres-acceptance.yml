name: PostgreSQL acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/postgres-acceptance.yml
      - package.json
      - packages/db/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json
  push:
    branches: [main]
    paths:
      - .github/workflows/postgres-acceptance.yml
      - package.json
      - packages/db/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.base.json

permissions:
  contents: read

concurrency:
  group: postgres-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-acceptance:
    name: PostgreSQL 17.11 acceptance (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: docker.io/library/postgres:17.11-bookworm@sha256:84560e3b9c6874893fc4e2854f5dc3e7c1a37bc9d1dfd7a8c641310ae22ba5ad
        env:
          POSTGRES_DB: research_cockpit_acceptance_test
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
          POSTGRES_PASSWORD: postgres-acceptance-only
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=research_cockpit_acceptance_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run PostgreSQL acceptance
        env:
          CI: "true"
          RESEARCH_COCKPIT_PG_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: pnpm --filter @research-cockpit/db acceptance:postgres:ci

      - name: Upload PostgreSQL acceptance evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-acceptance-evidence-v2-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-postgres-acceptance-v2.json
          if-no-files-found: error
          retention-days: 30
