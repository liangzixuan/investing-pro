name: Appwrite site release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main CI run ID for this exact revision
        required: true
        type: string
      ci_run_attempt:
        description: Latest successful attempt of that CI run
        required: true
        type: string
      promote:
        description: Promote the tested artifact to the configured production site
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Serialize releases on the fixed staging origin and the account's single test slot.
concurrency:
  group: browserstack-deployed-preview-smoke
  cancel-in-progress: false

jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: appwrite-staging
    steps:
      - name: Check out the exact main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate public run selectors
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        run: |
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CI_RUN_ATTEMPT" =~ ^[1-9][0-9]{0,3}$ ]]

      - name: Download that CI attempt's source proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-proof-${{ inputs.ci_run_attempt }}
          path: dist/source-proof
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
          digest-mismatch: error

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify actual applicable GitHub checks
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: pnpm exec tsx scripts/appwrite/github-checks.ts verify --proof dist/source-proof/source-proof.json --ci-run-id "$CI_RUN_ID"

      - name: Build the production Clerk static site
        env:
          INVESTMENT_BUILD_SHA: ${{ github.sha }}
          INVESTMENT_CLERK_ENVIRONMENT: production
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsuaW52ZXN0aW5ncHJvLmFwcCQ
          INVESTMENT_CLERK_TRIAL_API_ORIGIN: https://api.investingpro.app
        run: pnpm --filter @research-cockpit/web exec vite build --config vite.clerk-trial.config.ts

      - name: Package the exact artifact
        run: pnpm exec tsx scripts/appwrite/site-artifact.ts

      - name: Deploy and activate staging
        timeout-minutes: 9
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_DEPLOY_KEY }}
        run: pnpm exec tsx apps/api/scripts/appwrite-site-release.ts stage --archive dist/appwrite-release/site.tar.gz --manifest dist/appwrite-release/manifest.json --receipt dist/appwrite-release/staging-receipt.json

      - name: Test this exact build on BrowserStack
        timeout-minutes: 5
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          INVESTMENT_EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/browserstack/run-web.ts --run-staging

      - name: Record successful staging acceptance
        run: pnpm exec tsx scripts/appwrite/staging-acceptance.ts

      - name: Retain the artifact and finite deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appwrite-site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/appwrite-release/
          if-no-files-found: ignore
          retention-days: 30

  production:
    needs: staging
    if: inputs.promote && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: appwrite-production
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Download the tested bytes without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appwrite-site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/appwrite-release
          digest-mismatch: error

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Promote the tested artifact
        timeout-minutes: 9
        env:
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_DEPLOY_KEY }}
          APPWRITE_PRODUCTION_SITE_ID: ${{ vars.APPWRITE_PRODUCTION_SITE_ID }}
        run: pnpm exec tsx apps/api/scripts/appwrite-site-release.ts promote --archive dist/appwrite-release/site.tar.gz --manifest dist/appwrite-release/manifest.json --receipt dist/production-receipt.json --acceptance dist/appwrite-release/browserstack-acceptance.json --staging-receipt dist/appwrite-release/staging-receipt.json

      - name: Retain production and rollback identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appwrite-production-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/production-receipt.json
          if-no-files-found: ignore
          retention-days: 30
