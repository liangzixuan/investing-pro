      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.13

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify parser source and adversarial corpus
        run: |
          pnpm --filter @research-cockpit/filing-parser typecheck
          pnpm --filter @research-cockpit/filing-parser test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-parser-fixtures

      - name: Run one-shot filing parser acceptance
        # Cycle 3d Windows ACL, CI, API-fixture, and parser-timeout routing
        # preserves the parser contract; this still verifies exact-HEAD evidence.
        env:
          CI: "true"
          FILING_PARSER_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-isolation-v1.json
        if: ${{ steps.cycle3ka1_route.outputs.exact != 'true' && steps.cycle3ka2_route.outputs.exact != 'true' && steps.cycle3la1_route.outputs.exact != 'true' && steps.cycle3ma1_route.outputs.exact != 'true' && steps.cycle3ma2_route.outputs.exact != 'true' && steps.cycle3ma3_route.outputs.exact != 'true' && steps.cycle3ma4_route.outputs.exact != 'true' && steps.cycle3ma5_route.outputs.exact != 'true' && steps.cycle3ma6_route.outputs.exact != 'true' && steps.cycle3ma7_route.outputs.exact != 'true' && steps.cycle3ha4_route.outputs.exact != 'true' && steps.cycle3ha5_route.outputs.exact != 'true' && steps.cycle3ha6_route.outputs.exact != 'true' && steps.cycle3ha7_route.outputs.exact != 'true' && steps.cycle3ha8_route.outputs.exact != 'true' && steps.cycle3ha9_route.outputs.exact != 'true' && steps.cycle3ha10_route.outputs.exact != 'true' && steps.cycle3ha11_route.outputs.exact != 'true' && steps.cycle3ha12_route.outputs.exact != 'true' && steps.cycle3ha13_route.outputs.exact != 'true' && steps.cycle3ha14_route.outputs.exact != 'true' && steps.cycle3ka3_route.outputs.exact != 'true' }}
