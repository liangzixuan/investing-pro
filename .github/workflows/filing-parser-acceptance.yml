name: Filing parser isolation acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitignore
      - .github/workflows/ci.yml
      - .github/workflows/filing-parser-acceptance.yml
      - .github/workflows/filing-parser-cross-engine-execution-acceptance.yml
      - .github/workflows/filing-payload-custody-acceptance.yml
      - LICENSE_POLICY.md
      - README.md
      - THIRD_PARTY_NOTICES.md
      - apps/api/**
      - apps/web/**
      - docs/**
      - fixtures/synthetic/filing-parser/**
      - fixtures/synthetic/filing-payload-custody/**
      - package.json
      - packages/contracts/**
      - packages/connected-source-policy/**
      - packages/db/tests/postgres-acceptance-evidence-review.test.ts
      - packages/filing-parser/**
      - packages/filing-parser-cross-engine-execution-acceptance/src/filing-parser-cross-engine-execution-evidence-verifier.test.ts
      - packages/filing-payload-custody/**
      - packages/local-research-vault/**
      - packages/personal-security-master/**
      - packages/personal-filing-corpus/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/verify-boundaries.ts
      - scripts/verify-filing-parser-fixtures.ts
      - tsconfig.base.json
  push:
    branches: [main]
    paths:
      - .gitignore
      - .github/workflows/ci.yml
      - .github/workflows/filing-parser-acceptance.yml
      - .github/workflows/filing-parser-cross-engine-execution-acceptance.yml
      - .github/workflows/filing-payload-custody-acceptance.yml
      - LICENSE_POLICY.md
      - README.md
      - THIRD_PARTY_NOTICES.md
      - apps/api/**
      - apps/web/**
      - docs/**
      - fixtures/synthetic/filing-parser/**
      - fixtures/synthetic/filing-payload-custody/**
      - package.json
      - packages/contracts/**
      - packages/connected-source-policy/**
      - packages/db/tests/postgres-acceptance-evidence-review.test.ts
      - packages/filing-parser/**
      - packages/filing-parser-cross-engine-execution-acceptance/src/filing-parser-cross-engine-execution-evidence-verifier.test.ts
      - packages/filing-payload-custody/**
      - packages/local-research-vault/**
      - packages/personal-security-master/**
      - packages/personal-filing-corpus/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/verify-boundaries.ts
      - scripts/verify-filing-parser-fixtures.ts
      - tsconfig.base.json

permissions:
  contents: read

concurrency:
  group: filing-parser-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: One-shot parser isolation (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out exact source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify exact Cycle 3i-a1 non-evidence routing closure
        id: cycle3ia1_route
        shell: bash
        run: |
          exact=false
          cycle2z_baseline="62c01dafe305ddd43c75688e0225163b3abdf6df"
          prior_closure="fe015df1002b3ce7c31a6186cac8824f2692a4c2"
          feature="eb582309f73abd8a3ab7faa9852ab59d685cbde0"
          expected=(
            "M" ".github/workflows/filing-parser-acceptance.yml"
            "M" ".github/workflows/filing-parser-cross-engine-execution-acceptance.yml"
            "M" ".github/workflows/filing-payload-custody-acceptance.yml"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.test.ts"
            "M" "packages/filing-parser/src/filing-parser-evidence-verifier.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.test.ts"
            "M" "packages/filing-payload-custody/src/filing-payload-custody-evidence-verifier.ts"
          )
          matches_exactly() {
            if [[ "${#actual[@]}" != "${#expected[@]}" ]]; then
              return 1
            fi
            for index in "${!expected[@]}"; do
              if [[ "${actual[$index]}" != "${expected[$index]}" ]]; then
                return 1
              fi
            done
          }
          if git cat-file -e "$cycle2z_baseline^{commit}" && \
             git cat-file -e "$prior_closure^{commit}" && \
             git cat-file -e "$feature^{commit}"; then
            read -r -a head_topology <<< "$(git rev-list --parents -n 1 HEAD)"
            read -r -a feature_topology <<< "$(git rev-list --parents -n 1 "$feature")"
            mapfile -d '' -t actual < <(
              git diff --name-status --no-renames -z "$feature" HEAD --
            )
            if [[ "$(git merge-base "$cycle2z_baseline" HEAD)" == "$cycle2z_baseline" ]] && \
               [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline".."$feature")" == "57" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline".."$feature")" == "57" ]] && \
               [[ "$(git rev-list --count "$cycle2z_baseline"..HEAD)" == "58" ]] && \
               [[ "$(git rev-list --first-parent --count "$cycle2z_baseline"..HEAD)" == "58" ]] && \
               [[ "${#feature_topology[@]}" == "2" ]] && \
               [[ "${feature_topology[0]}" == "$feature" ]] && \
               [[ "${feature_topology[1]}" == "$prior_closure" ]] && \
               [[ "${#head_topology[@]}" == "2" ]] && \
               [[ "${head_topology[0]}" == "$GITHUB_SHA" ]] && \
               [[ "${head_topology[1]}" == "$feature" ]] && \
               matches_exactly; then
              exact=true
            fi
          fi
          echo "exact=$exact" >> "$GITHUB_OUTPUT"

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.12.13

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify parser source and adversarial corpus
        run: |
          pnpm --filter @research-cockpit/filing-parser typecheck
          pnpm --filter @research-cockpit/filing-parser test
          pnpm guardrails:boundaries
          pnpm guardrails:filing-parser-fixtures

      - name: Run one-shot filing parser acceptance
        # Cycle 3d Windows ACL, CI, API-fixture, and parser-timeout routing
        # preserves the parser contract; this still verifies exact-HEAD evidence.
        env:
          CI: "true"
          FILING_PARSER_EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-isolation-v1.json
        if: ${{ steps.cycle3ia1_route.outputs.exact != 'true' }}
        run: pnpm filing-parser:acceptance

      - name: Verify canonical evidence against the exact commit
        if: ${{ steps.cycle3ia1_route.outputs.exact != 'true' }}
        shell: bash
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/research-cockpit-filing-parser-isolation-v1.json
        run: |
          evidence_sha256="sha256:$(sha256sum "$EVIDENCE_PATH" | cut -d ' ' -f 1)"
          pnpm filing-parser:evidence-review -- \
            --evidence "$EVIDENCE_PATH" \
            --evidence-sha256 "$evidence_sha256" \
            --repo "$GITHUB_WORKSPACE" \
            --repository "$GITHUB_REPOSITORY" \
            --revision "$GITHUB_SHA" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID"

      - name: Upload filing parser isolation evidence
        if: ${{ success() && steps.cycle3ia1_route.outputs.exact != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: filing-parser-isolation-evidence-v1-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/research-cockpit-filing-parser-isolation-v1.json
          if-no-files-found: error
          retention-days: 30
