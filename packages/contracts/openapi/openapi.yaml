openapi: 3.1.0
info:
  title: Research Cockpit Local API
  version: 0.5.0
  description: >-
    Evidence-first loopback API. Research data and the two research-state PUT
    operations remain synthetic-only. An explicit personal-readiness mode may
    additionally expose one coarse, value-free quality-gate status, and an
    explicit personal-fact mode may expose its startup-fixed projection, only
    behind a short-lived local owner session. An explicit personal-dossier
    mode may expose one startup-fixed, provenance-linked dossier graph through
    the same owner-session boundary. X-Demo-Persona values are public selectors,
    not secrets, credentials, or owner authentication.
servers:
  - url: http://127.0.0.1:3100
paths:
  /health/live:
    get:
      operationId: getLiveness
      responses:
        "200":
          description: Process is alive.
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Synthetic fixture is ready.
  /v1/instruments/{symbol}/dossier:
    get:
      operationId: getDossier
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: knownAt
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Rights-filtered synthetic dossier.
          headers:
            X-Data-As-Of:
              schema:
                type: string
        "400":
          description: Invalid request.
        "404":
          description: Unknown synthetic instrument.
  /v1/evidence/{evidenceId}:
    get:
      operationId: getEvidencePassport
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rights-cleared evidence passport.
        "404":
          description: Evidence is unknown or not display-authorized.
  /v1/personal-filing/session:
    get:
      operationId: checkPersonalOwnerSession
      summary: Check whether the browser holds the active local owner session.
      description: >-
        Body-free, noncacheable possession check. It requires the exact
        loopback peer, configured Host authority, same-site browser Origin,
        and host-only owner-session cookie. It returns no session identifier,
        expiry, private filing state, or other authority material. HEAD and
        query parameters are not accepted.
      security:
        - PersonalOwnerSession: []
      responses:
        "204":
          description: The exact local owner session is active.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
        "403":
          $ref: "#/components/responses/PersonalSessionForbidden"
  /v1/personal-filing/session/bootstrap:
    post:
      operationId: bootstrapPersonalOwnerSession
      summary: Consume the one-time local bootstrap secret.
      description: >-
        Body-free bootstrap operation for an explicitly selected personal
        startup. The exact 64-character lowercase-hex operator-supplied value
        appears only in the dedicated request header and is never returned.
        The operator must generate it from 32 fresh CSPRNG bytes for each
        process; the API enforces the encoding shape and per-process single use,
        not entropy or cross-process reuse. Exact same-site Origin, Host,
        loopback peer, and route-specific intent header checks provide the
        request boundary. The first valid request consumes the process-local
        bootstrap authority and creates one in-memory session; replay against
        that authority fails closed.
      parameters:
        - $ref: "#/components/parameters/XResearchCockpitBootstrap"
        - name: X-Research-Cockpit-Intent
          in: header
          required: true
          schema:
            type: string
            const: bootstrap
      responses:
        "204":
          description: The one-time bootstrap was consumed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            Set-Cookie:
              $ref: "#/components/headers/PersonalOwnerSessionCookie"
        "403":
          $ref: "#/components/responses/PersonalSessionForbidden"
  /v1/personal-filing/session/rotate:
    post:
      operationId: rotatePersonalOwnerSession
      summary: Replace the active owner-session authority.
      description: >-
        Body-free, authenticated rotation. The old cookie becomes invalid
        atomically, the absolute deadline does not move, and only a new
        nonpersistent HttpOnly cookie is issued.
      security:
        - PersonalOwnerSession: []
      parameters:
        - name: X-Research-Cockpit-Intent
          in: header
          required: true
          schema:
            type: string
            const: rotate
      responses:
        "204":
          description: The active owner session was rotated.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            Set-Cookie:
              $ref: "#/components/headers/PersonalOwnerSessionCookie"
        "403":
          $ref: "#/components/responses/PersonalSessionForbidden"
  /v1/personal-filing/session/logout:
    post:
      operationId: logoutPersonalOwnerSession
      summary: End the active local owner session.
      description: >-
        Body-free, authenticated logout. Server authority is invalidated and
        the browser receives an exact-path cookie deletion instruction.
      security:
        - PersonalOwnerSession: []
      parameters:
        - name: X-Research-Cockpit-Intent
          in: header
          required: true
          schema:
            type: string
            const: logout
      responses:
        "204":
          description: The active owner session was ended.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            Set-Cookie:
              $ref: "#/components/headers/PersonalOwnerSessionCookieDeletion"
        "403":
          $ref: "#/components/responses/PersonalSessionForbidden"
  /v1/personal-filing/session/revoke:
    post:
      operationId: revokePersonalOwnerSession
      summary: Explicitly revoke the active local owner authority.
      description: >-
        Body-free, authenticated revocation. The single active server-side
        authority is zeroed and the exact-path browser cookie is deleted. A
        new session requires process restart and an operator-supplied fresh
        bootstrap; reuse across processes is not detected.
      security:
        - PersonalOwnerSession: []
      parameters:
        - name: X-Research-Cockpit-Intent
          in: header
          required: true
          schema:
            type: string
            const: revoke
      responses:
        "204":
          description: The active owner authority was revoked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
            Set-Cookie:
              $ref: "#/components/headers/PersonalOwnerSessionCookieDeletion"
        "403":
          $ref: "#/components/responses/PersonalSessionForbidden"
  /v1/personal-filing/readiness:
    get:
      operationId: getPersonalFilingReadiness
      summary: Read the coarse local personal-filing quality readiness state.
      description: >-
        Local-only, value-free readiness boundary. The response reports only
        that the personal quality gate is ready while the data plane remains
        disabled. It exposes no private facts, labels, values, metrics,
        thresholds, hashes, identifiers, timestamps, source or owner-local
        paths, bindings, approvals, seals, receipts, or execution details.
        The operation accepts no path parameters, query parameters, request
        body, or caller-supplied readiness state. It requires the exact
        configured loopback Host authority and one allowlisted local browser
        Origin and an active owner-session cookie; HEAD is not exposed.
      security:
        - PersonalOwnerSession: []
      responses:
        "200":
          description: The coarse personal-filing quality gate is ready.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalFilingReadiness"
        "403":
          description: The request boundary or owner session is not accepted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No ready personal-filing quality gate is available.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/personal-filing/selected-facts:
    get:
      operationId: getPersonalFilingSelectedFacts
      summary: Read the owner-authorized selected personal filing facts.
      description: >-
        Local-only, personal single-user selected-fact boundary. The response
        contains only the startup-fixed owner-authorized normalized fact
        projection. It accepts no path parameters, query parameters, request
        body, caller-supplied selection, or caller-supplied release state. The
        operation requires the exact configured loopback Host authority and one
        same-site local browser Origin and an active owner-session cookie; HEAD
        is not exposed. Runtime enforces unique fact keys in canonical order.
      security:
        - PersonalOwnerSession: []
      responses:
        "200":
          description: The exact owner-authorized selected facts are available.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalFilingSelectedFacts"
        "403":
          description: The request boundary or owner session is not accepted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No owner-authorized selected-fact release is available.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/personal-filing/dossier:
    get:
      operationId: getPersonalFilingDossier
      summary: Read the owner-authorized personal filing dossier graph.
      description: >-
        Local-only, personal single-user dossier boundary. One atomic response
        carries the startup-fixed facts, evidence, known-at lineage, chart
        references, valuation-input references, and explicit omission state.
        It accepts no path parameters, query parameters, request body,
        caller-supplied selection, or caller-supplied release state. The
        operation requires the exact configured loopback Host authority, one
        same-site local browser Origin, and an active owner-session cookie;
        HEAD is not exposed. Runtime validates graph closure before release.
      security:
        - PersonalOwnerSession: []
      responses:
        "200":
          description: The exact owner-authorized personal dossier is available.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalFilingDossier"
        "403":
          description: The request boundary or owner session is not accepted.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: No owner-authorized personal dossier release is available.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Pragma:
              $ref: "#/components/headers/PragmaNoCache"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/theses/{thesisId}:
    put:
      operationId: updateSyntheticThesis
      summary: Replace one existing synthetic thesis.
      description: >-
        Updates only the thesis visible through the resolved synthetic persona.
        Exactly one X-Demo-Persona, If-Match, Idempotency-Key, and JSON
        Content-Type header is required; Content-Type is application/json with
        only an optional charset=utf-8 parameter. Query parameters and
        caller-supplied identity or tenancy
        headers (X-Organization-Id, X-Principal-Id, X-Membership-Role,
        X-Tenant-Id, or X-Role) are forbidden. The organization and principal
        come only from the resolved loopback request context. Idempotency is
        scoped by organization, principal, and this thesis-update operation;
        the operation includes this resource type and thesisId. The aggregate
        request body is capped at 384 KiB; after context resolution, an
        oversized body returns the same value-free 400 shape as other
        malformed input. Authorization is
        re-evaluated before an idempotent replay. A missing, duplicated,
        malformed, or unresolved persona, a non-loopback peer, or a caller
        authority header returns 403 before body parsing. A resolved context
        reaches input validation; viewer, inactive, and no-membership denial
        occurs in the service only after syntactically valid input and before
        existence, version, or idempotency evaluation.
      parameters:
        - $ref: "#/components/parameters/ThesisId"
        - $ref: "#/components/parameters/XDemoPersona"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThesisWriteRequest"
      responses:
        "200":
          description: >-
            Thesis updated, or an authorized exact replay returned while the
            resource remains at the recorded version.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
            X-Trace-Id:
              $ref: "#/components/headers/ServerTraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThesisWriteResponse"
        "400":
          $ref: "#/components/responses/InvalidWriteRequest"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ScopedResourceNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/IfMatchRequired"
        "500":
          $ref: "#/components/responses/UnexpectedWriteFailure"
  /v1/alerts/{alertId}:
    put:
      operationId: updateSyntheticAlert
      summary: Replace one existing synthetic alert rule.
      description: >-
        Updates only the alert visible through the resolved synthetic persona.
        Exactly one X-Demo-Persona, If-Match, Idempotency-Key, and JSON
        Content-Type header is required; Content-Type is application/json with
        only an optional charset=utf-8 parameter. Query parameters and
        caller-supplied identity or tenancy
        headers (X-Organization-Id, X-Principal-Id, X-Membership-Role,
        X-Tenant-Id, or X-Role) are forbidden. The organization and principal
        come only from the resolved loopback request context. Idempotency is
        scoped by organization, principal, and this alert-update operation;
        the operation includes this resource type and alertId. The aggregate
        request body is capped at 384 KiB; after context resolution, an
        oversized body returns the same value-free 400 shape as other
        malformed input. Authorization is
        re-evaluated before an idempotent replay. A missing, duplicated,
        malformed, or unresolved persona, a non-loopback peer, or a caller
        authority header returns 403 before body parsing. A resolved context
        reaches input validation; viewer, inactive, and no-membership denial
        occurs in the service only after syntactically valid input and before
        existence, version, or idempotency evaluation.
      parameters:
        - $ref: "#/components/parameters/AlertId"
        - $ref: "#/components/parameters/XDemoPersona"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertWriteRequest"
      responses:
        "200":
          description: >-
            Alert updated, or an authorized exact replay returned while the
            resource remains at the recorded version.
          headers:
            ETag:
              $ref: "#/components/headers/VersionETag"
            X-Trace-Id:
              $ref: "#/components/headers/ServerTraceId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertWriteResponse"
        "400":
          $ref: "#/components/responses/InvalidWriteRequest"
        "403":
          $ref: "#/components/responses/WriteForbidden"
        "404":
          $ref: "#/components/responses/ScopedResourceNotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "412":
          $ref: "#/components/responses/VersionConflict"
        "428":
          $ref: "#/components/responses/IfMatchRequired"
        "500":
          $ref: "#/components/responses/UnexpectedWriteFailure"
components:
  securitySchemes:
    PersonalOwnerSession:
      type: apiKey
      in: cookie
      name: research_cockpit_owner_session
      description: >-
        Host-only, HttpOnly, SameSite=Strict, nonpersistent local session
        cookie with Path=/v1/personal-filing. The API stores only its keyed
        digest and binds it to the exact browser Origin and API authority.
  parameters:
    XResearchCockpitBootstrap:
      name: X-Research-Cockpit-Bootstrap
      in: header
      required: true
      description: >-
        Exact 64-character lowercase-hex bootstrap value. The operator must
        derive it from 32 fresh CSPRNG bytes per process; the API enforces only
        its encoding and process-local single use. It must never enter a URL,
        request or response body, browser storage, log, or fixture.
      schema:
        type: string
        minLength: 64
        maxLength: 64
        pattern: "^[0-9a-f]{64}$"
    ThesisId:
      name: thesisId
      in: path
      required: true
      description: Existing synthetic thesis UUID.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89AaBb][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
    AlertId:
      name: alertId
      in: path
      required: true
      description: Existing synthetic alert UUID.
      schema:
        type: string
        format: uuid
        pattern: "^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[1-8][0-9A-Fa-f]{3}-[89AaBb][0-9A-Fa-f]{3}-[0-9A-Fa-f]{12}$"
    XDemoPersona:
      name: X-Demo-Persona
      in: header
      required: true
      description: >-
        Exactly one public, non-secret synthetic persona selector. It is not a
        credential and does not establish authentication or persona
        authenticity.
      schema:
        type: string
        enum:
          - synp_7f33c6a91d20
          - synp_b4108e2c753d
          - synp_0d94f6b821ae
          - synp_e62a1c9074bf
          - synp_5a6d91c20ef4
          - synp_c8e2475b109d
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one strong quoted positive JavaScript-safe integer version,
        such as "1". Weak tags, wildcard tags, lists, duplicates, zero,
        leading zeroes, malformed values, and values above 9007199254740991
        are rejected.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        maxLength: 18
        examples:
          - '"1"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Exactly one idempotency key, scoped by resolved organization,
        resolved principal, and operation. The operation includes the resource
        type and path ID, so another path or resource is a separate scope. For
        the same resolved organization and principal, one identical key may be
        used independently on a thesis path and an alert path; both valid
        operations can succeed and retain separate records.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
        examples:
          - thesis.update-0001
  headers:
    VersionETag:
      description: Strong quoted positive safe-integer resource version.
      required: true
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
        maxLength: 18
        examples:
          - '"2"'
    ServerTraceId:
      description: >-
        Server-generated request trace. A caller X-Trace-Id is ignored and
        never becomes request or audit identity.
      required: true
      schema:
        type: string
        pattern: "^trace-[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    NoStore:
      description: The response must not be stored.
      required: true
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      description: The local readiness response must remain private and must not be stored.
      required: true
      schema:
        type: string
        const: private, no-store
    PragmaNoCache:
      description: The local readiness response must not be cached by legacy intermediaries.
      required: true
      schema:
        type: string
        const: no-cache
    PersonalOwnerSessionCookie:
      description: >-
        Host-only nonpersistent cookie with Path=/v1/personal-filing,
        HttpOnly, and SameSite=Strict; Domain, Expires, and Max-Age are absent.
      required: true
      schema:
        type: string
        pattern: "^research_cockpit_owner_session=[A-Za-z0-9_-]{43}; Path=/v1/personal-filing; HttpOnly; SameSite=Strict$"
    PersonalOwnerSessionCookieDeletion:
      description: Exact-path deletion of the invalidated owner-session cookie.
      required: true
      schema:
        type: string
        const: research_cockpit_owner_session=; Path=/v1/personal-filing; HttpOnly; SameSite=Strict; Max-Age=0
  responses:
    PersonalSessionForbidden:
      description: >-
        The loopback, Host, Origin, header, cookie, CSRF-intent, expiry,
        rotation, logout, revocation, or bootstrap boundary was not accepted.
        The response is deliberately value-free and does not disclose which
        check failed or reflect any credential.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Pragma:
          $ref: "#/components/headers/PragmaNoCache"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    InvalidWriteRequest:
      description: >-
        Idempotency-Key or Content-Type is missing, a non-persona header is
        malformed or duplicated, or the content type, path, body, or query
        shape is invalid. Missing If-Match is instead 428. The response is
        deliberately value-free.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    WriteForbidden:
      description: >-
        The demo-persona header is missing, malformed, duplicated, or
        unresolved; the exact peer is not loopback; a caller authority header
        is present; or, after syntactically valid input, the resolved membership
        cannot update. The response is deliberately value-free.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ScopedResourceNotFound:
      description: >-
        No resource is visible in the resolved synthetic context. The response
        is deliberately value-free and does not disclose another scope.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    IdempotencyConflict:
      description: >-
        In the same organization, principal, and path operation, this key was
        already used with a different body or If-Match value. Keys used on a
        different path or resource are in a separate operation scope. An exact
        replay also conflicts after the recorded resource version is
        superseded. The response is deliberately value-free.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    VersionConflict:
      description: >-
        The strong If-Match version is stale. The response is deliberately
        value-free and does not disclose the current version.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    IfMatchRequired:
      description: >-
        The required If-Match precondition is absent. The response is
        deliberately value-free.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    UnexpectedWriteFailure:
      description: An unexpected value-free internal failure.
      headers:
        X-Trace-Id:
          $ref: "#/components/headers/ServerTraceId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ThesisWriteRequest:
      type: object
      additionalProperties: false
      required:
        - instrumentId
        - claim
        - evidence
        - risks
        - invalidation
      properties:
        instrumentId:
          $ref: "#/components/schemas/InstrumentId"
        claim:
          $ref: "#/components/schemas/ThesisClaim"
        evidence:
          $ref: "#/components/schemas/ThesisEvidence"
        risks:
          $ref: "#/components/schemas/ThesisRisks"
        invalidation:
          $ref: "#/components/schemas/ThesisInvalidation"
    AlertWriteRequest:
      type: object
      additionalProperties: false
      required:
        - instrumentId
        - metricKey
        - operator
        - threshold
      properties:
        instrumentId:
          $ref: "#/components/schemas/InstrumentId"
        metricKey:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        operator:
          type: string
          enum:
            - above
            - below
        threshold:
          type: string
          maxLength: 64
          pattern: "^-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?$"
    ThesisWriteResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - synthetic
        - id
        - instrumentId
        - claim
        - evidence
        - risks
        - invalidation
        - version
        - createdAt
        - updatedAt
      properties:
        schemaVersion:
          const: "1.0.0"
        synthetic:
          const: true
        id:
          type: string
          format: uuid
        instrumentId:
          $ref: "#/components/schemas/InstrumentId"
        claim:
          $ref: "#/components/schemas/ThesisClaim"
        evidence:
          $ref: "#/components/schemas/ThesisEvidence"
        risks:
          $ref: "#/components/schemas/ThesisRisks"
        invalidation:
          $ref: "#/components/schemas/ThesisInvalidation"
        version:
          $ref: "#/components/schemas/ResourceVersion"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AlertWriteResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - synthetic
        - id
        - instrumentId
        - metricKey
        - operator
        - threshold
        - version
        - createdAt
        - updatedAt
      properties:
        schemaVersion:
          const: "1.0.0"
        synthetic:
          const: true
        id:
          type: string
          format: uuid
        instrumentId:
          $ref: "#/components/schemas/InstrumentId"
        metricKey:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{0,63}$"
        operator:
          type: string
          enum:
            - above
            - below
        threshold:
          type: string
          maxLength: 64
          pattern: "^-?(?:0|[1-9][0-9]*)(?:\\.[0-9]+)?$"
        version:
          $ref: "#/components/schemas/ResourceVersion"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PersonalFilingReadiness:
      type: object
      description: >-
        Coarse local-only readiness with the private data plane disabled. This
        schema contains no private fact, metric, hash, path, or binding.
      additionalProperties: false
      required:
        - schemaVersion
        - profile
        - status
        - dataPlane
      properties:
        schemaVersion:
          const: "1.0.0"
        profile:
          const: personal_single_user_local
        status:
          const: quality_gate_ready
        dataPlane:
          const: disabled
    PersonalFilingSelectedFacts:
      type: object
      description: >-
        Exact owner-authorized personal single-user normalized fact projection.
        Fact-key uniqueness and canonical ordering are enforced by the runtime.
      additionalProperties: false
      required:
        - schemaVersion
        - profile
        - status
        - facts
      properties:
        schemaVersion:
          const: "1.0.0"
        profile:
          const: personal_single_user_local
        status:
          const: selected_facts_released
        facts:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/PersonalFilingSelectedFact"
    PersonalFilingSelectedFact:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - unit
        - periodStart
        - periodEnd
      properties:
        key:
          type: string
          enum:
            - assets
            - cash
            - debt
            - diluted_shares
            - free_cash_flow
            - gross_profit
            - net_income
            - operating_cash_flow
            - operating_income
            - revenue
        value:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^-?(?:0|[1-9][0-9]{0,25})(?:\\.[0-9]{0,11}[1-9])?$"
        unit:
          type: string
          enum:
            - USD
            - shares
        periodStart:
          type:
            - string
            - "null"
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        periodEnd:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    PersonalFilingDossier:
      type: object
      description: >-
        One startup-fixed, owner-authorized, provenance-linked personal filing
        dossier. Every identifier is response-local and every reference closes
        within this atomic response.
      additionalProperties: false
      required:
        - asOf
        - chart
        - dataMode
        - evidence
        - facts
        - lineage
        - omissions
        - profile
        - schemaVersion
        - status
        - valuationInputs
      properties:
        asOf:
          type: string
          format: date-time
        chart:
          $ref: "#/components/schemas/PersonalFilingDossierChart"
        dataMode:
          const: personal
        evidence:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PersonalFilingDossierEvidence"
        facts:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/PersonalFilingDossierFact"
        lineage:
          $ref: "#/components/schemas/PersonalFilingDossierLineage"
        omissions:
          $ref: "#/components/schemas/PersonalFilingDossierOmissions"
        profile:
          const: personal_single_user_local
        schemaVersion:
          const: "1.0.0"
        status:
          const: personal_dossier_released
        valuationInputs:
          $ref: "#/components/schemas/PersonalFilingDossierValuationInputs"
    PersonalFilingDossierFact:
      type: object
      additionalProperties: false
      required:
        - evidenceId
        - id
        - key
        - knownFrom
        - knownToExclusive
        - label
        - periodEnd
        - periodStart
        - unit
        - value
        - version
      properties:
        evidenceId:
          type: string
          pattern: "^evidence-[0-9]{4}$"
        id:
          type: string
          pattern: "^fact-[0-9]{4}$"
        key:
          $ref: "#/components/schemas/PersonalFilingDossierFactKey"
        knownFrom:
          type: string
          format: date-time
        knownToExclusive:
          type:
            - string
            - "null"
          format: date-time
        label:
          type: string
          minLength: 1
          maxLength: 80
        periodEnd:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        periodStart:
          type:
            - string
            - "null"
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        unit:
          type: string
          enum:
            - USD
            - shares
        value:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^-?(?:0|[1-9][0-9]{0,25})(?:\\.[0-9]{0,11}[1-9])?$"
        version:
          type: string
          enum:
            - current
            - superseded
    PersonalFilingDossierEvidence:
      type: object
      additionalProperties: false
      required:
        - derivationFormula
        - derivationOperands
        - factId
        - id
        - sourceAcceptedAt
        - sourceAccession
        - sourceAvailableAt
        - sourceConcept
        - sourceContentSha256
        - sourceDocumentSha256
        - taxonomy
      properties:
        derivationFormula:
          type:
            - string
            - "null"
          enum:
            - operating_cash_flow_minus_capital_expenditures
            - null
        derivationOperands:
          type: array
          minItems: 0
          maxItems: 2
          items:
            $ref: "#/components/schemas/PersonalFilingDossierDerivationOperand"
        factId:
          type: string
          pattern: "^fact-[0-9]{4}$"
        id:
          type: string
          pattern: "^evidence-[0-9]{4}$"
        sourceAcceptedAt:
          type: string
          format: date-time
        sourceAccession:
          type: string
          minLength: 1
          maxLength: 40
        sourceAvailableAt:
          type: string
          format: date-time
        sourceConcept:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 200
        sourceContentSha256:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        sourceDocumentSha256:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        taxonomy:
          type: string
          minLength: 1
          maxLength: 200
      oneOf:
        - title: Direct personal filing evidence
          properties:
            derivationFormula:
              type: "null"
            derivationOperands:
              type: array
              maxItems: 0
            sourceConcept:
              type: string
              minLength: 1
              maxLength: 200
        - title: Derived free-cash-flow evidence
          properties:
            derivationFormula:
              const: operating_cash_flow_minus_capital_expenditures
            derivationOperands:
              type: array
              minItems: 2
              maxItems: 2
              prefixItems:
                - allOf:
                    - $ref: "#/components/schemas/PersonalFilingDossierDerivationOperand"
                    - type: object
                      properties:
                        role:
                          const: minuend
                - allOf:
                    - $ref: "#/components/schemas/PersonalFilingDossierDerivationOperand"
                    - type: object
                      properties:
                        role:
                          const: subtrahend
              items: false
            sourceConcept:
              type: "null"
    PersonalFilingDossierDerivationOperand:
      type: object
      additionalProperties: false
      required:
        - concept
        - periodEnd
        - periodStart
        - role
        - unit
        - value
      properties:
        concept:
          type: string
          minLength: 1
          maxLength: 200
        periodEnd:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        periodStart:
          type: string
          format: date
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
        role:
          type: string
          enum:
            - minuend
            - subtrahend
        unit:
          const: USD
        value:
          type: string
          minLength: 1
          maxLength: 40
          pattern: "^-?(?:0|[1-9][0-9]{0,25})(?:\\.[0-9]{0,11}[1-9])?$"
    PersonalFilingDossierLineage:
      type: object
      additionalProperties: false
      required:
        - events
        - scope
        - status
      properties:
        events:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PersonalFilingDossierLineageEvent"
        scope:
          const: issuer_filing_versions_within_exact_frozen_manifest_only
        status:
          type: string
          enum:
            - amendment_supersession_observed
            - root_only_no_in_corpus_amendment
    PersonalFilingDossierLineageEvent:
      type: object
      additionalProperties: false
      required:
        - effectiveAt
        - key
        - predecessorFactId
        - successorFactId
      properties:
        effectiveAt:
          type: string
          format: date-time
        key:
          $ref: "#/components/schemas/PersonalFilingDossierFactKey"
        predecessorFactId:
          type: string
          pattern: "^fact-[0-9]{4}$"
        successorFactId:
          type: string
          pattern: "^fact-[0-9]{4}$"
    PersonalFilingDossierChart:
      oneOf:
        - $ref: "#/components/schemas/PersonalFilingDossierChartReady"
        - $ref: "#/components/schemas/PersonalFilingDossierChartUnsupported"
    PersonalFilingDossierChartReady:
      type: object
      additionalProperties: false
      required:
        - series
        - status
      properties:
        series:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/PersonalFilingDossierChartSeries"
        status:
          const: ready
    PersonalFilingDossierChartUnsupported:
      type: object
      additionalProperties: false
      required:
        - reasonCode
        - status
      properties:
        reasonCode:
          const: NO_OWNER_APPROVED_CHART_FACTS
        status:
          const: unsupported
    PersonalFilingDossierChartSeries:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - points
        - unit
      properties:
        key:
          $ref: "#/components/schemas/PersonalFilingDossierFactKey"
        label:
          type: string
          minLength: 1
          maxLength: 80
        points:
          type: array
          minItems: 1
          maxItems: 2
          items:
            $ref: "#/components/schemas/PersonalFilingDossierChartPoint"
        unit:
          type: string
          enum:
            - USD
            - shares
    PersonalFilingDossierChartPoint:
      type: object
      additionalProperties: false
      required:
        - factId
      properties:
        factId:
          type: string
          pattern: "^fact-[0-9]{4}$"
    PersonalFilingDossierValuationInputs:
      oneOf:
        - $ref: "#/components/schemas/PersonalFilingDossierValuationInputsReady"
        - $ref: "#/components/schemas/PersonalFilingDossierValuationInputsUnsupported"
    PersonalFilingDossierValuationInputsReady:
      type: object
      additionalProperties: false
      required:
        - baseRevenueFactId
        - cashFactId
        - debtFactId
        - dilutedSharesFactId
        - modelVersion
        - status
      properties:
        baseRevenueFactId:
          type: string
          pattern: "^fact-[0-9]{4}$"
        cashFactId:
          type: string
          pattern: "^fact-[0-9]{4}$"
        debtFactId:
          type: string
          pattern: "^fact-[0-9]{4}$"
        dilutedSharesFactId:
          type: string
          pattern: "^fact-[0-9]{4}$"
        modelVersion:
          const: exit-multiple-v1
        status:
          const: ready
    PersonalFilingDossierValuationInputsUnsupported:
      type: object
      additionalProperties: false
      required:
        - reasonCode
        - status
      properties:
        reasonCode:
          type: string
          enum:
            - INPUT_OUT_OF_DOMAIN
            - REQUIRED_FACTS_NOT_RELEASED
        status:
          const: unsupported
    PersonalFilingDossierOmissions:
      type: object
      additionalProperties: false
      required:
        - count
        - explanation
        - hasOmissions
        - reasonCode
      properties:
        count:
          type: "null"
        explanation:
          type: string
          minLength: 1
          maxLength: 240
        hasOmissions:
          type: boolean
        reasonCode:
          const: OWNER_FIXED_SCOPE
    PersonalFilingDossierFactKey:
      type: string
      enum:
        - assets
        - cash
        - debt
        - diluted_shares
        - free_cash_flow
        - gross_profit
        - net_income
        - operating_cash_flow
        - operating_income
        - revenue
    InstrumentId:
      type: string
      minLength: 3
      maxLength: 160
      pattern: "^[A-Za-z0-9._:-]+$"
    ThesisClaim:
      type: string
      description: Safe text whose length limit counts Unicode code points.
      minLength: 1
      maxLength: 4000
      pattern: '^(?=[\s\S]*\S)[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
    ThesisEvidence:
      type: string
      description: Safe text whose length limit counts Unicode code points.
      minLength: 1
      maxLength: 8000
      pattern: '^(?=[\s\S]*\S)[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
    ThesisRisks:
      type: string
      description: Safe text whose length limit counts Unicode code points.
      minLength: 1
      maxLength: 8000
      pattern: '^(?=[\s\S]*\S)[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
    ThesisInvalidation:
      type: string
      description: Safe text whose length limit counts Unicode code points.
      minLength: 1
      maxLength: 4000
      pattern: '^(?=[\s\S]*\S)[^\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
    ResourceVersion:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    ProblemDetails:
      type: object
      description: >-
        Stable problem shape with no rejected value, resolved identity or
        role, tenant-state detail, current resource version, or cross-scope
        existence detail.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
        - instance
        - traceId
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
